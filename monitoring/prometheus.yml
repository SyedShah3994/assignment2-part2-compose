global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: web
    dns_sd_configs:
      - names: ['web']
        type: A
        port: 5000

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']